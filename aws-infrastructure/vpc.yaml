apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: VPC
metadata:
  name: demo-vpc
  namespace: production
spec:
  forProvider:
    region: eu-central-1
    cidrBlock: 10.0.0.0/16
    enableDnsSupport: true
    enableDnsHostnames: true
    tags:
      Name: demo-vpc
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
